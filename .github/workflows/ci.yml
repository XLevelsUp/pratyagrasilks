name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test and build
        run: pnpm turbo run lint typecheck test build
        env:
          # next build evaluates modules that read these at import time and
          # would throw on `undefined!`. They are placeholders: CI never
          # reaches a real Supabase project, it only proves the apps compile.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://pratyagrasilks.com
          NEXT_PUBLIC_ADMIN_URL: https://admin.pratyagrasilks.com
          NEXT_PUBLIC_STOREFRONT_URL: https://pratyagrasilks.com
